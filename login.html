<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Safe Aid</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <!-- Brand Section -->
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-shield-heart"></i>
                </div>

                <h1>Safe<span>Aid</span></h1>
            </div>

            <!-- Login Card -->
            <section class="login-card">

                <div class="login-heading">
                    <h2>Welcome Back!</h2>
                    <p>Sign in to continue to your Safe Aid account.</p>
                </div>

                <!-- Login Form -->
                <form id="loginForm" novalidate>

                    <div class="form-group">

                        <label for="identity">
                            Email or Phone Number
                        </label>

                        <div class="input-wrapper">
                            <i class="fa-regular fa-user input-icon"></i>

                            <input
                                type="text"
                                id="identity"
                                name="identity"
                                placeholder="Enter your email or phone number"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <small class="error-message" id="identityError"></small>

                    </div>


                    <div class="form-group">

                        <label for="password">Password</label>

                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>

                        <small class="error-message" id="passwordError"></small>

                    </div>


                    <div class="form-options">

                        <label class="remember-option">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>

                        <a href="#" id="forgotPassword">
                            Forgot Password?
                        </a>

                    </div>


                    <button type="submit" class="login-button">
                        <span>Login to Account</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <div id="loginMessage" class="login-message"></div>

                </form>


                <div class="login-divider">
                    <span>SAFE AID</span>
                </div>

                <div class="security-note">
                    <i class="fa-solid fa-shield-halved"></i>

                    <p>
                        Your safety and privacy matter to us.
                    </p>
                </div>

            </section>


            <!-- Bottom Text -->
            <div class="bottom-text">
                <p>
                    &copy; 2026 Safe Aid. All rights reserved.
                </p>

                <p class="demo-note">
                    Frontend Demo Version
                </p>
            </div>

        </div>

    </main>

    <script src="login.js"></script>

</body>
</html>
